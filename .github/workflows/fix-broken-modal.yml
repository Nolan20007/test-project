name: Fix broken modal (срочный фикс tmp-902 и l-16)

on:
  workflow_dispatch:   # запуск вручную из вкладки Actions

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run fix-broken-modal.js
        run: node scripts/fix-broken-modal.js

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(a11y): restore broken JS on tmp-902 and l-16 [skip ci]"
          git push

      - name: No changes
        if: steps.changes.outputs.has_changes == 'false'
        run: echo "✓ Изменений нет — скрипт ничего не поменял (всё уже исправлено)"
