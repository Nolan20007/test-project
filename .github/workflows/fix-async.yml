name: Fix async async (one-time)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Исправление async async
        run: |
          for file in ss1.html ss2.html ssg1.html kl-1-dlya-kanalizacionnyh-kolodcev.html vl-2-l-19-vodoprovodnaya.html l-16-dlya-teplovyh-setej.html tmp-902.html; do
            if [ -f "$file" ]; then
              sed -i 's/async async window\.changeImage = changeImage;/window.changeImage = changeImage;/g' "$file"
              echo "  ✓ $file"
            fi
          done

      - name: Коммит и пуш
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --staged --quiet || git commit -m "auto: fix async async [skip ci]"
          git push
