name: Clean .cart-button from HTML (one-time)

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Чистка .cart-button из HTML
        run: node build/clean-cart-button.js

      - name: Коммит и пуш
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --staged --quiet || git commit -m "auto: clean .cart-button from HTML [skip ci]"
          git push
