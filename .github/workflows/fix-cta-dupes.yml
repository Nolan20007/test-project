name: One-time fix CTA marker duplicates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Схлопнуть дубли CTA_START/CTA_END и дубль color в .close-btn
        run: |
          set -e
          changed=0
          for f in *.html; do
            [ -e "$f" ] || continue
            before=$(wc -c < "$f")

            # 1) два и более подряд идущих CTA_START (с любыми пробелами/переводами строк) → один
            perl -0pi -e 's/(<!--\s*CTA_START\s*-->)(?:\s*<!--\s*CTA_START\s*-->)+/$1/g' "$f"
            # 2) то же для CTA_END
            perl -0pi -e 's/(<!--\s*CTA_END\s*-->)(?:\s*<!--\s*CTA_END\s*-->)+/$1/g' "$f"
            # 3) дубль "color: #f1f1f1;" внутри .close-btn (два одинаковых подряд через пробелы) → один
            perl -0pi -e 's/(color:\s*#f1f1f1;)(?:\s*color:\s*#f1f1f1;)+/$1/g' "$f"

            after=$(wc -c < "$f")
            if [ "$before" != "$after" ]; then
              echo "  ✓ $f — схлопнуто $((before - after)) символов"
              changed=$((changed + 1))
            fi
          done
          echo "Изменено файлов: $changed"

      - name: Удалить сам workflow
        run: |
          git rm .github/workflows/fix-cta-dupes.yml || true
          rm -f .github/workflows/fix-cta-dupes.yml

      - name: Commit & push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Нечего коммитить"; exit 0
          fi
          git commit -m "chore: схлопнуты дубли CTA-маркеров и color в .close-btn + удалён одноразовый workflow [skip ci]"
          git push
