name: Replace .png with .webp in CSV (one-time)

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Запуск скрипта
        run: node build/update-csv-webp.js

      - name: Коммит и пуш
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 'data/*.csv'
          git diff --staged --quiet || git commit -m "auto: replace .png with .webp in CSV [skip ci]"
          git pull --rebase origin main
          git push
