name: Fix CSS dupes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean HTML files
        run: |
          set -e
          for f in *.html; do
            [ -e "$f" ] || continue
            
            # 1. Удаляем .contact-summary { ... }
            perl -0pi -e 's/\.contact-summary\s*\{[^}]*\}\s*//g' "$f"
            
            # 2. Схлопываем дубли CTA
            perl -0pi -e 's/(<!--\s*CTA_START\s*-->)(?:\s*<!--\s*CTA_START\s*-->)+/$1/g' "$f"
            perl -0pi -e 's/(<!--\s*CTA_END\s*-->)(?:\s*<!--\s*CTA_END\s*-->)+/$1/g' "$f"

            # 3. Чистим дубли color внутри .close-btn
            # Используем классические /.../ без скобок {} в регулярке
            perl -0pi -e '
              s/(\.close-btn\s*\{)([^}]*)(\})/
                my $open = $1; my $body = $2; my $close = $3;
                my $seen = 0;
                $body =~ s{(color\s*:\s*[^;]+;)}{ $seen++ ? "" : $1 }ge;
                $open . $body . $close;
              /gse;
            ' "$f"
          done
          echo "Done"

      - name: Delete workflow and commit
        run: |
          git rm .github/workflows/fix-css-dupes.yml || true
          rm -f .github/workflows/fix-css-dupes.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: fix css dupes [skip ci]"
          git push
