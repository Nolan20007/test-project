name: Convert PNG to WebP (one-time)

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установка sharp
        run: npm install sharp --no-save

      - name: Запуск конвертера
        run: node build/convert-images.js

      - name: Коммит и пуш созданных .webp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 'images/**/*.webp' 'images/*.webp'
          git diff --staged --quiet || git commit -m "auto: convert PNG to WebP [skip ci]"
          git pull --rebase origin main
          git push
