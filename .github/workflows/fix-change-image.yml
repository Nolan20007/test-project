name: Fix changeImage (one-time)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Запуск скрипта
        run: node build/fix-change-image.js

      - name: Коммит и пуш
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --staged --quiet || git commit -m "auto: fix changeImage for mainSource (webp) [skip ci]"
          git pull --rebase origin main
          git push
