name: Inject CTA Markers (One-time)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/inject-cta-markers.yml'

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean old CTA and Inject new markers
        run: |
          node -e "
          const fs = require('fs');
          
          // Все html, кроме index.html и 404.html
          const files = fs.readdirSync('.').filter(f => 
            f.endsWith('.html') && f !== 'index.html' && f !== '404.html'
          );
          
          let modified = 0;
          
          files.forEach(file => {
            let html = fs.readFileSync(file, 'utf8');
            let originalHtml = html;
            
            // 1. УДАЛЯЕМ СТАРЫЙ БЛОК CTA
            // Ищем <section class=\"contact-summary\"> ... </section>
            html = html.replace(/<section\s+class=\"contact-summary\"[^>]*>[\s\S]*?<\/section>/gi, '');
            
            // На всякий случай убираем div-вариант с тем же классом
            html = html.replace(/<div\s+class=\"contact-summary\"[^>]*>[\s\S]*?<\/div>/gi, '');
            
            // Убираем лишние пустые строки, оставшиеся после удаления
            html = html.replace(/\n\s*\n\s*\n/g, '\n\n');

            // 2. ВСТАВЛЯЕМ НОВЫЕ МАРКЕРЫ (если их еще нет)
            if (!html.includes('<!-- CTA_START -->')) {
              let insertIndex = -1;
              if (html.includes('<!-- FOOTER_START -->')) {
                insertIndex = html.indexOf('<!-- FOOTER_START -->');
              } else {
                const footerTagIdx = html.search(/<footer\b/i);
                if (footerTagIdx !== -1) insertIndex = footerTagIdx;
              }
              
              if (insertIndex !== -1) {
                const before = html.slice(0, insertIndex);
                const after = html.slice(insertIndex);
                html = before + '\n<!-- CTA_START -->\n<!-- CTA_END -->\n\n' + after;
              }
            }
            
            if (html !== originalHtml) {
              fs.writeFileSync(file, html, 'utf8');
              modified++;
              console.log('  ✓ Обработан ' + file);
            }
          });
          
          console.log('Готово. Обновлено файлов: ' + modified);
          "

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m "chore: remove old CTA blocks and inject new markers" || echo "No changes to commit"
          git push
