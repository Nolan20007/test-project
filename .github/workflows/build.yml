name: Build HTML from CSV

on:
  push:
    paths:
      - 'data/**.csv'
      - 'build/build.js'
      - 'includes/**.html'
  workflow_dispatch:

# Защита от параллельных запусков: если workflow уже выполняется,
# новый запуск встанет в очередь (или будет отменён — см. ниже).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Запуск сборщика
        run: node build/build.js

      - name: Коммит и пуш, если что-то изменилось
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'yandex-feed.xml'
          if git diff --staged --quiet; then
            echo "Нет изменений — коммит не нужен"
          else
            git commit -m "auto: rebuild from CSV [skip ci]"
            git pull --rebase origin main
            git push
          fi
