name: Build HTML from CSV

on:
  push:
    paths:
      - 'data/**.csv'
      - 'build/build.js'
      - 'build/seo-check.js'
      - 'build/download-fonts.js'
      - 'build/seo-check.js'
      - 'build/optimize-card-images.js'
      - '.github/workflows/**'
      - 'css/**'
      - 'images/**'
      - 'index.html'
      - 'templates/**.html'
      - 'includes/**.html'
  pull_request:
    paths:
      - 'data/**.csv'
      - 'build/build.js'
      - 'build/download-fonts.js'
      - 'build/optimize-card-images.js'
      - '.github/workflows/**'
      - 'css/**'
      - 'index.html'
      - 'templates/**.html'
      - 'includes/**.html'
  workflow_dispatch:

# Для main важнее всего собрать последнюю версию, а не накапливать устаревшие запуски.
# Новый push отменяет старую сборку; актуальная сборка начинается с последнего main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Push-событие может ждать в очереди и к моменту старта уже устареть.
      # Для main синхронизируем рабочее дерево с текущей вершиной ветки до сборки.
      - name: Синхронизация с актуальным main
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Загрузка локальных шрифтов Rubik
        run: node build/download-fonts.js

      - name: Установка sharp для обработки изображений
        run: npm install sharp --no-save

      - name: Конвертация PNG в WebP
        run: node build/convert-images.js

      - name: Генерация облегчённых изображений карточек
        run: node build/optimize-card-images.js

      - name: Запуск сборщика
        run: node build/build.js

      - name: Проверка SEO, sitemap, robots и Product JSON-LD
        run: node build/seo-check.js

      - name: Коммит и пуш, если что-то изменилось
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # npm may remove tracked files under node_modules; restore them from main.
          git restore --source=origin/main --worktree --staged -- node_modules/ || true
          # Stage tracked changes, then add only non-ignored untracked files.
          # This avoids wildcard pathspecs traversing ignored node_modules.
          git add -u
          git ls-files --others --exclude-standard -z | xargs -0 -r git add --
          if git diff --staged --quiet; then
            echo "Нет изменений — коммит не нужен"
          else
            git commit -m "auto: rebuild from CSV [skip ci]"
            git push
          fi
