name: Build HTML from CSV

on:
  push:
    paths:
      - 'data/**.csv'
      - 'build/build.js'
      - 'includes/**.html'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Запуск сборщика
        run: node build/build.js

      - name: Коммит и пуш, если что-то изменилось
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'yandex-feed.xml'
          git diff --staged --quiet || git commit -m "auto: rebuild from CSV [skip ci]"
          git pull --rebase origin main
          git push