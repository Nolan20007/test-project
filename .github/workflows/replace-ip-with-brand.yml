name: Replace IP with brand name (one-time)

on:
  workflow_dispatch:

jobs:
  replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Запуск замены
        run: node build/replace-ip-with-brand.js

      - name: Коммит и пуш
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'humans.txt'
          git diff --staged --quiet || git commit -m "auto: replace IP with brand name [skip ci]"
          git pull --rebase origin main
          git push
